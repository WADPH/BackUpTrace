# BackUpTrace -- Grafana-managed alert rules.
#
# One rule produces one alert per (source, job): the query returns a row per
# job, its two text columns become alert labels, and Grafana tracks each label
# set as an independent alert instance. A job that goes stale while others are
# already stale therefore still produces its own notification.
#
# Requires:
#   - the Postgres datasource with uid `backuptrace-postgres`
#     (grafana/provisioning/datasources/datasource.yml)
#   - a contact point named exactly as `notification_settings.receiver` below
#
# See the "Alerting on stale jobs" section of README.md for how to load this.
apiVersion: 1

groups:
  - orgId: 1
    name: staleness
    folder: BackUpTrace
    # How often Grafana runs the query. Backup state changes at most once a
    # day, so a shorter interval buys nothing -- and on a SQLite-backed Grafana
    # it causes "database is locked" errors.
    interval: 10m
    rules:
      - uid: backuptrace-stale-job
        title: 'BackUpTrace: stale backup job'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: backuptrace-postgres
            model:
              refId: A
              datasource:
                type: grafana-postgresql-datasource
                uid: backuptrace-postgres
              editorMode: code
              rawQuery: true
              # Format MUST be `table`. The two text columns become labels (one
              # alert instance per job); the single numeric column becomes the
              # value the threshold is applied to. `time series` would make
              # Grafana look for a time column and fail.
              format: table
              # overdue_ratio normalises every job onto one scale: 1.0 = exactly
              # at its own staleness window. This is what keeps the rule
              # source-agnostic -- a nightly job with a 60h window and a weekly
              # one with a 192h window are both compared against 1, and a new
              # source needs no change here.
              #
              # 2160 (90 days) is the fallback for sources that report no
              # stale_after_hours. Keep it in sync with the dashboard's
              # "Stale after (hours)" variable.
              rawSql: |
                SELECT
                    source_name,
                    COALESCE(job_name, '(no job)') AS job_name,
                    hours_since_backup / COALESCE(stale_after_hours, 2160) AS overdue_ratio
                FROM latest_backup_status
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 1
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []
              intervalMs: 1000
              maxDataPoints: 43200
        # No `for:` -- pending period 0. Staleness is a slow monotonic
        # transition, there is nothing to wait for confirmation on.
        #
        # The query always returns one row per job, so an empty result or an
        # error means Postgres is unreachable -- itself worth an alert.
        noDataState: Alerting
        execErrState: Alerting
        dashboardUid: backuptrace-main
        panelId: 27
        annotations:
          __dashboardUid__: backuptrace-main
          __panelId__: '27'
          summary: 'Backup is overdue: {{ $labels.source_name }} / {{ $labels.job_name }}'
          description: The window exceeds the permissible limit by {{ $values.A.Value | printf "%.1f" }}x
        isPaused: false
        # Simplified routing: the rule names its contact point directly, so no
        # notification policy tree is needed.
        #
        # group_by must include source_name and job_name. Without them every
        # stale job is merged into one notification and a newly stale job is
        # easy to miss inside a message about the old ones.
        notification_settings:
          receiver: BackUpTrace Telegram
          group_by:
            - grafana_folder
            - alertname
            - source_name
            - job_name
          # How often to remind about a job that is still stale. Grafana's
          # default is 4h (6 messages a day per stuck job).
          repeat_interval: 1w
